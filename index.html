<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two-Piece Collection — Publish Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111214; --mid:#6b6f76; --line:#e6e7ea; --bg:#f5f5f7; --card:#fff;
    --green:#0f7a3d; --greenbg:#e9f6ee; --grey:#9a9ea6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:56px 28px 80px}
  header{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  h1{font-family:Oswald,sans-serif;font-weight:600;font-size:34px;line-height:1;letter-spacing:.06em;text-transform:uppercase;margin:0}
  .sub{margin:10px 0 0;color:var(--mid);font-size:14px}
  .counts{display:flex;gap:26px;text-align:right}
  .count b{display:block;font-family:Oswald,sans-serif;font-size:26px;line-height:1;letter-spacing:.02em}
  .count span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s ease, box-shadow .18s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(17,18,20,.07)}
  .shot{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden;padding:12px}
  .shot img{width:100%;height:100%;object-fit:contain;display:block}
  .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .name{font-size:14px;font-weight:600;line-height:1.3;margin:0}
  .sku{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--mid);letter-spacing:.02em}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto}
  .cost{font-size:15px;font-weight:600}
  .cost small{font-size:11px;font-weight:500;color:var(--mid);margin-left:4px}
  .retail{font-size:11px;color:var(--mid)}
  .pill{position:absolute;z-index:3;top:10px;left:10px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--greenbg);color:var(--green)}
  .vars{font-size:11px;color:var(--mid)}
  .colhead{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#9a9ea6;margin-top:4px}
  .cols{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:10px;line-height:1;padding:4px 7px;border-radius:5px;background:#f3f4f6;color:#4c5157;white-space:nowrap}
  .card.missing .chip{background:#f6f6f7;color:#a2a6ad}
  /* missing */
  .card.missing{background:#fbfbfc;border-style:dashed;border-color:#d9dbdf}
  .card.missing:hover{transform:none;box-shadow:none}
  .card.missing .shot img{filter:grayscale(1) contrast(.92) brightness(1.06);opacity:.42}
  .card.missing .pill{background:#fff;border:1px solid #cfd2d7;color:#4c5157;font-weight:600}
  .card.missing .name,.card.missing .cost{color:#8b8f97}
  .card.missing .sku{color:#a9adb4}
  .card.missing .shot::after{content:"Awaiting source";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8b8f97;
    z-index:2;background:repeating-linear-gradient(45deg,rgba(255,255,255,.62) 0 10px,rgba(255,255,255,.3) 10px 20px)}
  .note{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--mid);font-size:12px;line-height:1.7;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .note b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Two-Piece Collection</h1>
      <p class="sub">Publish preview &middot; TeemDrop unit costs, MOQ&nbsp;1 &middot; store ehh05e-7q</p>
    </div>
    <div class="counts">
      <div class="count"><b>7</b><span>Ready</span></div>
      <div class="count"><b>1</b><span>Missing</span></div>
      <div class="count"><b>8</b><span>Total</span></div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="note">
    <div><b>Ready</b> = TD product exists, SKU + cost confirmed, connect &amp; publish only.<br>
    <b>Missing</b> = no TD product on file (SRC00442223 failed — broken link).</div>
    <div>Generated 26 Oct 2026 &middot; costs in USD</div>
  </div>
</div>

<script>
const items = [
  {name:"Faux Two-Piece Bra", img:"img/shop_bra_0.jpg", sku:"SUWOCIB00672", cost:"$7.39", retail:"retail $32.99", vars:"12 variants", sizes:"S\u2013XL (spotty)", ready:true, colours:["Azure blue / yellow", "Pomegranate red / blue", "Blue + red", "Dark blue / yellow", "Meteorite black / yellow"]},
  {name:"Halter Tank + Wide-Leg Set", img:"img/set_0.jpg", sku:"SUSPAWY00663", cost:"$4.11\u201310.15", retail:"no retail yet", vars:"84 variants \u00b7 7 prints \u00d7 Top/Pants/Set", sizes:"S\u2013XL", ready:true, colours:["White polka dot", "Black polka dot", "Navy polka dot", "Brown polka dot", "Black stripe", "Brown stripe", "Navy stripe"]},
  {name:"Halter Cami", img:"img/shop_cami_0.jpg", sku:"SUSPAWY00629", cost:"$7.85", retail:"retail $32.99", vars:"24 variants", sizes:"S\u2013XL", ready:true, colours:["White", "Dark brown", "Green", "Navy blue", "Purple", "Black"]},
  {name:"Halter Long Sleeve", img:"img/shop_ls_0.jpg", sku:"SUSPAWY00468", cost:"$5.15\u201312.11", retail:"retail $37.99", vars:"64 variants \u00b7 4 colours \u00d7 4 builds", sizes:"S\u2013XL", ready:true, colours:["Premium black", "Heather grey", "Swan white", "Badge blue"]},
  {name:"Wide-Leg Pants", img:"img/shop_pants_0.jpg", sku:"SUSPAWY00650", cost:"$5.38", retail:"retail $36.99", vars:"25 variants", sizes:"S\u2013XXL", ready:true, colours:["Black", "Off-white", "Gray", "Brown", "Mist blue"]},
  {name:"Fold-Over Wide-Leg Pants", img:"img/shop_fold_0.jpg", sku:"SUSPAWY00645", cost:"$11.10", retail:"retail $39.99", vars:"39 variants", sizes:"S\u2013XL (spotty)", ready:true, colours:["Cream apricot", "Mist charcoal", "Olive green", "Berry rose", "Raspberry red", "Black coffee", "Badge blue", "Moss green", "Eggplant purple", "Phantom blue", "Cherry blossom", "Lilac purple"]},
  {name:"Faux Two-Piece Set", img:"img/fauxset_full.jpg", sku:"SUSPAWY00668", cost:"$17.96", retail:"retail $64.99", vars:"9 variants", sizes:"spotty", ready:true, colours:["Pomegranate red / blue", "Biluo blue / yellow", "Maoqing blue / yellow", "Maoqing blue / red"]},
  {name:"Faux Two-Piece Stripe Set", img:"img/shop_stripe_0.jpg", sku:"no TD product", cost:"\u2014", retail:"SRC00442223 failed", vars:"needs new link", sizes:"draft only", ready:false, colours:["Black stripe", "Navy stripe", "Brown stripe"]}
];

document.getElementById('grid').innerHTML = items.map(it => `
  <article class="card ${it.ready ? '' : 'missing'}">
    <div class="shot">
      <span class="pill">${it.ready ? 'Ready' : 'Not available'}</span>
      <img src="${it.img}" alt="${it.name}" loading="lazy">
    </div>
    <div class="body">
      <h2 class="name">${it.name}</h2>
      <div class="sku">${it.sku}</div>
      <div class="row">
        <div class="cost">${it.cost}<small>${it.ready && it.cost !== '—' ? 'unit' : ''}</small></div>
        <div class="retail">${it.retail}</div>
      </div>
      <div class="vars">${it.vars}</div>
      <div class="colhead">Colours &middot; ${it.colours.length} &middot; ${it.sizes}</div>
      <div class="cols">${it.colours.map(c => `<span class="chip">${c}</span>`).join('')}</div>
    </div>
  </article>
`).join('');
</script>
</body>
</html>
